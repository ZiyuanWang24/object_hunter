[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "objecthunter"
version = "0.1.0"
description = "Uncertainty-aware object-centric spatial memory for robotic perception"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "opencv-python>=4.8"]

[project.optional-dependencies]
perception = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.3", "transformers>=4.40", "Pillow>=10"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["objecthunter*"]
